<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title description">
  <title id="title">Infrastructure module topology</title>
  <desc id="description">An abstract diagram with inputs flowing through reusable module nodes to outputs and review checkpoints.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171d2a"/>
      <stop offset="1" stop-color="#0c111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb454"/>
      <stop offset="1" stop-color="#9e87ed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2b3446" stroke-width="1" opacity=".48"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="718" height="558" rx="30" fill="url(#panel)" stroke="#354158" stroke-width="2"/>
  <rect x="2" y="2" width="716" height="556" rx="29" fill="url(#grid)"/>
  <text x="48" y="58" fill="#94a4ba" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="2">MODULE GRAPH / REVIEW PATH</text>

  <g fill="none" stroke="#7968bc" stroke-width="3" opacity=".9">
    <path d="M132 177 274 139"/>
    <path d="M132 280 274 243"/>
    <path d="M132 383 274 347"/>
    <path d="M382 139 528 191"/>
    <path d="M382 243 528 280"/>
    <path d="M382 347 528 369"/>
    <path d="M328 171v40m0 64v40" stroke-dasharray="7 8"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g>
      <rect x="48" y="143" width="116" height="68" rx="12" fill="#1b2331" stroke="#49566d"/>
      <text x="106" y="172" text-anchor="middle" fill="#ffbd66" font-size="14">INPUTS</text>
      <text x="106" y="193" text-anchor="middle" fill="#c3cedd" font-size="13">name · tags</text>
      <rect x="48" y="246" width="116" height="68" rx="12" fill="#1b2331" stroke="#49566d"/>
      <text x="106" y="275" text-anchor="middle" fill="#ffbd66" font-size="14">POLICY</text>
      <text x="106" y="296" text-anchor="middle" fill="#c3cedd" font-size="13">team-owned</text>
      <rect x="48" y="349" width="116" height="68" rx="12" fill="#1b2331" stroke="#49566d"/>
      <text x="106" y="378" text-anchor="middle" fill="#ffbd66" font-size="14">REVISION</text>
      <text x="106" y="399" text-anchor="middle" fill="#c3cedd" font-size="13">pinned ref</text>
    </g>

    <g>
      <rect x="274" y="101" width="108" height="76" rx="16" fill="#2b2447" stroke="#a58fe9" stroke-width="2"/>
      <text x="328" y="134" text-anchor="middle" fill="#e5dcff" font-size="14">NETWORK</text>
      <text x="328" y="155" text-anchor="middle" fill="#ad9edc" font-size="12">module</text>
      <rect x="274" y="205" width="108" height="76" rx="16" fill="#2b2447" stroke="#a58fe9" stroke-width="2"/>
      <text x="328" y="238" text-anchor="middle" fill="#e5dcff" font-size="14">COMPUTE</text>
      <text x="328" y="259" text-anchor="middle" fill="#ad9edc" font-size="12">module</text>
      <rect x="274" y="309" width="108" height="76" rx="16" fill="#2b2447" stroke="#a58fe9" stroke-width="2"/>
      <text x="328" y="342" text-anchor="middle" fill="#e5dcff" font-size="14">DATA</text>
      <text x="328" y="363" text-anchor="middle" fill="#ad9edc" font-size="12">module</text>
    </g>

    <g>
      <rect x="528" y="157" width="144" height="68" rx="12" fill="#1b2331" stroke="#49566d"/>
      <circle cx="553" cy="191" r="8" fill="#69d6a5"/>
      <text x="572" y="187" fill="#e1e7ef" font-size="14">OUTPUTS</text>
      <text x="572" y="206" fill="#94a4ba" font-size="12">ids · arns</text>
      <rect x="528" y="246" width="144" height="68" rx="12" fill="#1b2331" stroke="#49566d"/>
      <circle cx="553" cy="280" r="8" fill="#ffb454"/>
      <text x="572" y="276" fill="#e1e7ef" font-size="14">EXAMPLE</text>
      <text x="572" y="295" fill="#94a4ba" font-size="12">public-safe</text>
      <rect x="528" y="335" width="144" height="68" rx="12" fill="#1b2331" stroke="#49566d"/>
      <circle cx="553" cy="369" r="8" fill="#bdabff"/>
      <text x="572" y="365" fill="#e1e7ef" font-size="14">REVIEW</text>
      <text x="572" y="384" fill="#94a4ba" font-size="12">checkpoints</text>
    </g>
  </g>

  <rect x="48" y="472" width="624" height="44" rx="22" fill="#171f2d" stroke="#354158"/>
  <rect x="57" y="481" width="224" height="26" rx="13" fill="url(#accent)" opacity=".9"/>
  <text x="360" y="500" text-anchor="middle" fill="#d1dae6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">explicit inputs → focused module → inspectable result</text>
</svg>
